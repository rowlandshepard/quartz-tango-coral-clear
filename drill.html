  <script>
    const CARDS = [{"id":"l2-t-biology","lecture":2,"type":"Term","front":"Biology","back":"Scientific study of living things (bios = life, logia = study)."},{"id":"l2-t-ecology","lecture":2,"type":"Term","front":"Ecology","back":"Scientific study of organisms and their environment."},{"id":"l2-t-science","lecture":2,"type":"Term","front":"Science","back":"Systematic observation of nature to discover facts and formulate principles, theories, and laws."},{"id":"l2-t-hypothesis","lecture":2,"type":"Term","front":"Hypothesis","back":"Proposed explanation that is testable and falsifiable."},{"id":"l2-t-observation","lecture":2,"type":"Term","front":"Observation","back":"Recognizing a fact or occurrence, often with measurement."},{"id":"l2-t-data","lecture":2,"type":"Term","front":"Data","back":"Values of qualitative or quantitative variables belonging to a set of items."},{"id":"l2-t-qualitative-data","lecture":2,"type":"Term","front":"Qualitative data","back":"Descriptions observed but not measured (color, texture, smell)."},{"id":"l2-t-quantitative-data","lecture":2,"type":"Term","front":"Quantitative data","back":"Measured numeric data (mass, temperature, count)."},{"id":"l2-t-independent-variable","lecture":2,"type":"Term","front":"Independent variable","back":"The factor the experimenter changes."},{"id":"l2-t-dependent-variable","lecture":2,"type":"Term","front":"Dependent variable","back":"The factor that is measured; it depends on the independent variable."},{"id":"l2-t-control-group","lecture":2,"type":"Term","front":"Control group","back":"Receives every element of the experiment except the factor being tested."},{"id":"l2-t-controlled-variables","lecture":2,"type":"Term","front":"Controlled variables","back":"Factors held constant so they do not confound results."},{"id":"l2-t-falsifiable","lecture":2,"type":"Term","front":"Falsifiable","back":"Possible, in principle, to show the claim is wrong."},{"id":"l2-t-principle","lecture":2,"type":"Term","front":"Principle","back":"A fundamental finding based on a single evaluation of a hypothesis."},{"id":"l2-t-theory","lecture":2,"type":"Term","front":"Theory","back":"Repeatedly tested explanatory framework; not a casual guess."},{"id":"l2-t-law","lecture":2,"type":"Term","front":"Law","back":"Generalization that describes what happens without explaining why."},{"id":"l2-t-inductive-reasoning","lecture":2,"type":"Term","front":"Inductive reasoning","back":"Specific observations used to reach a general conclusion (small to big)."},{"id":"l2-t-deductive-reasoning","lecture":2,"type":"Term","front":"Deductive reasoning","back":"General law or theory used to predict a specific result (big to small)."},{"id":"l2-t-peer-review","lecture":2,"type":"Term","front":"Peer review","back":"Independent experts evaluate a manuscript before publication."},{"id":"l2-t-serendipity-in-science","lecture":2,"type":"Term","front":"Serendipity in science","back":"Fortunate accident that becomes science only after it is tested (Fleming / penicillin)."},{"id":"l2-c-hypothesis-vs-theory-vs-law","lecture":2,"type":"Compare","front":"Hypothesis vs theory vs law","back":"Hypothesis = testable idea; theory = supported explanation; law = descriptive rule."},{"id":"l2-c-qualitative-vs-quantitative","lecture":2,"type":"Compare","front":"Qualitative vs quantitative","back":"Words and qualities vs numbers."},{"id":"l2-c-independent-vs-dependent-variable","lecture":2,"type":"Compare","front":"Independent vs dependent variable","back":"What you change vs what you measure."},{"id":"l2-c-inductive-vs-deductive","lecture":2,"type":"Compare","front":"Inductive vs deductive","back":"Data up to a generalization vs principle down to a prediction."},{"id":"l3-t-peer-reviewed-journal","lecture":3,"type":"Term","front":"Peer-reviewed journal","back":"Gold-standard source; hard to publish; ~70% of papers rejected."},{"id":"l3-t-imrad","lecture":3,"type":"Term","front":"IMRaD","back":"Introduction, Methods, Results, Discussion."},{"id":"l3-t-abstract","lecture":3,"type":"Term","front":"Abstract","back":"Short summary of the entire paper."},{"id":"l3-t-introduction","lecture":3,"type":"Term","front":"Introduction","back":"States the unknown; starts broad and narrows to this study."},{"id":"l3-t-methods","lecture":3,"type":"Term","front":"Methods","back":"Detailed enough that another lab can replicate."},{"id":"l3-t-results","lecture":3,"type":"Term","front":"Results","back":"What was found; numbers and statistics."},{"id":"l3-t-discussion","lecture":3,"type":"Term","front":"Discussion","back":"What the results mean in context of the introduction."},{"id":"l3-t-review-paper","lecture":3,"type":"Term","front":"Review paper","back":"Summarizes many studies; does not follow IMRaD."},{"id":"l3-t-boolean-and","lecture":3,"type":"Term","front":"Boolean AND","back":"Requires both search terms (narrows)."},{"id":"l3-t-boolean-or","lecture":3,"type":"Term","front":"Boolean OR","back":"Retrieves either term (broadens)."},{"id":"l3-t-boolean-not","lecture":3,"type":"Term","front":"Boolean NOT","back":"Excludes a term."},{"id":"l3-t-homeostasis","lecture":3,"type":"Term","front":"Homeostasis","back":"Maintenance of internal constancy."},{"id":"l3-t-irritability","lecture":3,"type":"Term","front":"Irritability","back":"Ability to respond to stimuli."},{"id":"l3-t-adaptation","lecture":3,"type":"Term","front":"Adaptation","back":"A trait that helps survival/reproduction."},{"id":"l3-t-evolution","lecture":3,"type":"Term","front":"Evolution","back":"Change in populations across generations."},{"id":"l3-t-eight-criteria-of-life","lecture":3,"type":"Term","front":"Eight criteria of life","back":"Organization, metabolism, homeostasis, reproduction, growth/development, irritability, adaptation, evolution."},{"id":"l3-t-atom","lecture":3,"type":"Term","front":"Atom","back":"Smallest unit of an element that keeps its chemical properties."},{"id":"l3-t-population","lecture":3,"type":"Term","front":"Population","back":"Individuals of one species in an area."},{"id":"l3-t-community","lecture":3,"type":"Term","front":"Community","back":"All species interacting in an area."},{"id":"l3-t-ecosystem","lecture":3,"type":"Term","front":"Ecosystem","back":"Community plus abiotic environment."},{"id":"l3-t-biosphere","lecture":3,"type":"Term","front":"Biosphere","back":"All ecosystems on Earth."},{"id":"l3-c-abstract-vs-discussion","lecture":3,"type":"Compare","front":"Abstract vs discussion","back":"Whole-paper summary vs interpretation of meaning."},{"id":"l3-c-review-paper-vs-research-paper","lecture":3,"type":"Compare","front":"Review paper vs research paper","back":"Many-study summary vs original experiment in IMRaD."},{"id":"l3-c-adaptation-vs-evolution","lecture":3,"type":"Compare","front":"Adaptation vs evolution","back":"Helpful trait vs change across generations."},{"id":"l3-c-population-vs-community","lecture":3,"type":"Compare","front":"Population vs community","back":"One species vs all interacting species."},{"id":"l3-c-ecosystem-vs-biosphere","lecture":3,"type":"Compare","front":"Ecosystem vs biosphere","back":"One community + environment vs all ecosystems."},{"id":"l4-t-proton","lecture":4,"type":"Term","front":"Proton","back":"+1 charge, ~1 amu, in the nucleus; number defines the element."},{"id":"l4-t-neutron","lecture":4,"type":"Term","front":"Neutron","back":"0 charge, ~1 amu, in the nucleus; number can vary (isotopes)."},{"id":"l4-t-electron","lecture":4,"type":"Term","front":"Electron","back":"−1 charge, negligible mass, in orbitals."},{"id":"l4-t-nucleus-atom","lecture":4,"type":"Term","front":"Nucleus (atom)","back":"Center of the atom containing protons and neutrons."},{"id":"l4-t-atomic-number","lecture":4,"type":"Term","front":"Atomic number","back":"Number of protons; identity of the element."},{"id":"l4-t-mass-number","lecture":4,"type":"Term","front":"Mass number","back":"Protons plus neutrons."},{"id":"l4-t-isotope","lecture":4,"type":"Term","front":"Isotope","back":"Same protons, different neutrons (C-12 vs C-14)."},{"id":"l4-t-atomic-mass","lecture":4,"type":"Term","front":"Atomic mass","back":"Weighted average of an element's isotopes (Cl ≈ 35.45)."},{"id":"l4-t-molecule","lecture":4,"type":"Term","front":"Molecule","back":"Two or more atoms chemically bonded."},{"id":"l4-t-compound","lecture":4,"type":"Term","front":"Compound","back":"Substance containing atoms of more than one element."},{"id":"l4-t-reactant","lecture":4,"type":"Term","front":"Reactant","back":"Substance going into a chemical reaction (left of arrow)."},{"id":"l4-t-product","lecture":4,"type":"Term","front":"Product","back":"Substance formed by a chemical reaction (right of arrow)."},{"id":"l4-t-conservation-of-mass","lecture":4,"type":"Term","front":"Conservation of mass","back":"Mass is not created or destroyed; equations stay balanced."},{"id":"l4-t-ion","lecture":4,"type":"Term","front":"Ion","back":"Atom that gained or lost electrons to stabilize its outer shell."},{"id":"l4-t-cation","lecture":4,"type":"Term","front":"Cation","back":"Positive ion formed by losing electrons."},{"id":"l4-t-anion","lecture":4,"type":"Term","front":"Anion","back":"Negative ion formed by gaining electrons (names often end in -ide)."},{"id":"l4-t-ionic-bond","lecture":4,"type":"Term","front":"Ionic bond","back":"Attraction between opposite ions after electron transfer (NaCl)."},{"id":"l4-t-electrolyte","lecture":4,"type":"Term","front":"Electrolyte","back":"Dissolved ion such as Na+, K+, Ca2+ needed for nerves and muscle."},{"id":"l4-t-covalent-bond","lecture":4,"type":"Term","front":"Covalent bond","back":"Atoms share electrons; strongest common bond in living chemistry."},{"id":"l4-t-polar-covalent-bond","lecture":4,"type":"Term","front":"Polar covalent bond","back":"Unequal sharing of electrons (water)."},{"id":"l4-t-nonpolar-covalent-bond","lecture":4,"type":"Term","front":"Nonpolar covalent bond","back":"Equal sharing of electrons (O2)."},{"id":"l4-t-hydrogen-bond","lecture":4,"type":"Term","front":"Hydrogen bond","back":"Weak attraction between δ+ H on one molecule and δ− on another."},{"id":"l4-t-polarity-of-water","lecture":4,"type":"Term","front":"Polarity of water","back":"O is δ−, H is δ+; molecule has no net charge."},{"id":"l4-c-atomic-number-vs-mass-number","lecture":4,"type":"Compare","front":"Atomic number vs mass number","back":"Protons only vs protons + neutrons."},{"id":"l4-c-cation-vs-anion","lecture":4,"type":"Compare","front":"Cation vs anion","back":"Lost electrons (+) vs gained electrons (−)."},{"id":"l4-c-ionic-vs-covalent","lecture":4,"type":"Compare","front":"Ionic vs covalent","back":"Transfer electrons vs share electrons."},{"id":"l4-c-polar-vs-nonpolar-covalent","lecture":4,"type":"Compare","front":"Polar vs nonpolar covalent","back":"Unequal sharing (H2O) vs equal sharing (O2)."},{"id":"l4-c-hydrogen-bond-vs-covalent-bond","lecture":4,"type":"Compare","front":"Hydrogen bond vs covalent bond","back":"Weak between molecules vs strong sharing inside a molecule."},{"id":"l4-c-molecule-vs-compound","lecture":4,"type":"Compare","front":"Molecule vs compound","back":"≥2 atoms vs ≥2 different elements (O2 is a molecule, not a compound)."},{"id":"l5-t-organic-molecule","lecture":5,"type":"Term","front":"Organic molecule","back":"Contains carbon; macromolecules dominate dry mass of cells."},{"id":"l5-t-monomer","lecture":5,"type":"Term","front":"Monomer","back":"Building-block molecule."},{"id":"l5-t-polymer","lecture":5,"type":"Term","front":"Polymer","back":"Chain of monomers linked by covalent bonds."},{"id":"l5-t-dehydration-synthesis","lecture":5,"type":"Term","front":"Dehydration synthesis","back":"Join monomers, release water, require energy."},{"id":"l5-t-hydrolysis","lecture":5,"type":"Term","front":"Hydrolysis","back":"Insert water, break a polymer, release energy."},{"id":"l5-t-enzyme","lecture":5,"type":"Term","front":"Enzyme","back":"Biological catalyst; not consumed; specific (protease, lipase)."},{"id":"l5-t-carbohydrate","lecture":5,"type":"Term","front":"Carbohydrate","back":"Energy and structure; formula (CH2O)n; C:H:O ≈ 1:2:1."},{"id":"l5-t-monosaccharide","lecture":5,"type":"Term","front":"Monosaccharide","back":"Simple sugar, usually 3–7 carbons; glucose is the main human fuel."},{"id":"l5-t-disaccharide","lecture":5,"type":"Term","front":"Disaccharide","back":"Two monosaccharides joined by a glycosidic bond (sucrose, lactose, maltose)."},{"id":"l5-t-polysaccharide","lecture":5,"type":"Term","front":"Polysaccharide","back":"Long chain of sugars; may be branched."},{"id":"l5-t-glycosidic-bond","lecture":5,"type":"Term","front":"Glycosidic bond","back":"Covalent bond joining sugars."},{"id":"l5-t-lactose","lecture":5,"type":"Term","front":"Lactose","back":"Glucose + galactose."},{"id":"l5-t-starch","lecture":5,"type":"Term","front":"Starch","back":"Plant energy-storage polysaccharide of glucose."},{"id":"l5-t-glycogen","lecture":5,"type":"Term","front":"Glycogen","back":"Animal energy-storage polysaccharide of glucose."},{"id":"l5-t-cellulose","lecture":5,"type":"Term","front":"Cellulose","back":"Structural glucose polymer in plant cell walls."},{"id":"l5-t-lipid","lecture":5,"type":"Term","front":"Lipid","back":"Hydrophobic molecule used for storage, membranes, insulation."},{"id":"l5-t-triglyceride","lecture":5,"type":"Term","front":"Triglyceride","back":"Glycerol + three fatty acids; energy storage."},{"id":"l5-t-phospholipid","lecture":5,"type":"Term","front":"Phospholipid","back":"Two fatty-acid tails + phosphate head; membrane building block."},{"id":"l5-t-protein","lecture":5,"type":"Term","front":"Protein","back":"Polymer of amino acids; enzymes, structure, contraction."},{"id":"l5-t-amino-acid","lecture":5,"type":"Term","front":"Amino acid","back":"Protein monomer: amino group, carboxyl group, variable R group."},{"id":"l5-t-peptide-bond","lecture":5,"type":"Term","front":"Peptide bond","back":"Covalent bond between amino acids."},{"id":"l5-t-primary-structure","lecture":5,"type":"Term","front":"Primary structure","back":"Amino-acid sequence of a protein."},{"id":"l5-t-secondary-structure","lecture":5,"type":"Term","front":"Secondary structure","back":"Local folding such as α-helix and β-sheet."},{"id":"l5-t-tertiary-structure","lecture":5,"type":"Term","front":"Tertiary structure","back":"Overall 3-D fold of one polypeptide."},{"id":"l5-t-quaternary-structure","lecture":5,"type":"Term","front":"Quaternary structure","back":"Assembly of multiple polypeptide subunits."},{"id":"l5-t-denaturation","lecture":5,"type":"Term","front":"Denaturation","back":"Unfolding that destroys protein function."},{"id":"l5-t-nucleic-acid","lecture":5,"type":"Term","front":"Nucleic acid","back":"DNA or RNA; information molecules."},{"id":"l5-t-nucleotide","lecture":5,"type":"Term","front":"Nucleotide","back":"Sugar + phosphate + nitrogenous base."},{"id":"l5-t-dna","lecture":5,"type":"Term","front":"DNA","back":"Double helix, deoxyribose, bases A T G C; archives instructions."},{"id":"l5-t-rna","lecture":5,"type":"Term","front":"RNA","back":"Usually single-stranded, ribose, bases A U G C; working copies."},{"id":"l5-c-dehydration-vs-hydrolysis","lecture":5,"type":"Compare","front":"Dehydration vs hydrolysis","back":"Build + lose water + use energy vs break + add water + release energy."},{"id":"l5-c-starch-vs-glycogen-vs-cellulose","lecture":5,"type":"Compare","front":"Starch vs glycogen vs cellulose","back":"Plant store / animal store / plant wall — all glucose, different links."},{"id":"l5-c-phospholipid-vs-triglyceride","lecture":5,"type":"Compare","front":"Phospholipid vs triglyceride","back":"Membrane lipid vs storage fat."},{"id":"l5-c-primary-vs-tertiary-structure","lecture":5,"type":"Compare","front":"Primary vs tertiary structure","back":"Sequence vs overall 3-D fold."},{"id":"l5-c-dna-vs-rna","lecture":5,"type":"Compare","front":"DNA vs RNA","back":"T + double helix + deoxyribose vs U + usually single + ribose."},{"id":"l6-t-cell","lecture":6,"type":"Term","front":"Cell","back":"Smallest unit of a living thing; basic building block of organisms."},{"id":"l6-t-cell-theory","lecture":6,"type":"Term","front":"Cell theory","back":"All life is cellular; the cell is the basic unit of life; new cells come from existing cells."},{"id":"l6-t-light-microscope","lecture":6,"type":"Term","front":"Light microscope","back":"Lab scope, about 40×–1000×, inverted image, often needs stain."},{"id":"l6-t-electron-microscope","lecture":6,"type":"Term","front":"Electron microscope","back":"Higher magnification and resolution; large and expensive."},{"id":"l6-t-prokaryote","lecture":6,"type":"Term","front":"Prokaryote","back":"No nucleus (nucleoid); no membrane-bound organelles; generally smaller."},{"id":"l6-t-eukaryote","lecture":6,"type":"Term","front":"Eukaryote","back":"True nucleus and membrane-bound organelles; generally larger."},{"id":"l6-t-nucleoid","lecture":6,"type":"Term","front":"Nucleoid","back":"Region of DNA in a prokaryote."},{"id":"l6-t-plasma-membrane","lecture":6,"type":"Term","front":"Plasma membrane","back":"Boundary of the cell; present in plants and animals."},{"id":"l6-t-nucleus","lecture":6,"type":"Term","front":"Nucleus","back":"Houses DNA in eukaryotes."},{"id":"l6-t-rough-er","lecture":6,"type":"Term","front":"Rough ER","back":"ER with ribosomes; proteins for secretion or membranes."},{"id":"l6-t-smooth-er","lecture":6,"type":"Term","front":"Smooth ER","back":"ER without ribosomes; lipids, detox, Ca2+ storage."},{"id":"l6-t-golgi-apparatus","lecture":6,"type":"Term","front":"Golgi apparatus","back":"Sorts, tags, packages, ships proteins/lipids; plant wall sugars."},{"id":"l6-t-lysosome","lecture":6,"type":"Term","front":"Lysosome","back":"Digestive organelle; helps destroy pathogens in animals."},{"id":"l6-t-mitochondrion","lecture":6,"type":"Term","front":"Mitochondrion","back":"Energy-conversion organelle in plant and animal cells."},{"id":"l6-t-chloroplast","lecture":6,"type":"Term","front":"Chloroplast","back":"Photosynthetic organelle in plant cells."},{"id":"l6-t-central-vacuole","lecture":6,"type":"Term","front":"Central vacuole","back":"Large storage/support compartment typical of plant cells."},{"id":"l6-t-cell-wall","lecture":6,"type":"Term","front":"Cell wall","back":"Rigid plant outer layer; not in animal cells."},{"id":"l6-t-cytoskeleton","lecture":6,"type":"Term","front":"Cytoskeleton","back":"Protein-fiber network for shape, anchoring, and movement."},{"id":"l6-t-microfilament","lecture":6,"type":"Term","front":"Microfilament","back":"Narrowest fiber; used in cell movement (e.g., white blood cells)."},{"id":"l6-t-intermediate-filament","lecture":6,"type":"Term","front":"Intermediate filament","back":"Structural fiber; keratin in hair and nails."},{"id":"l6-t-microtubule","lecture":6,"type":"Term","front":"Microtubule","back":"Widest hollow fiber; cilia, flagella, centrioles."},{"id":"l6-t-extracellular-matrix","lecture":6,"type":"Term","front":"Extracellular matrix","back":"Protein/carb mesh outside animal cells; holds tissues and aids communication."},{"id":"l6-t-plasmodesmata","lecture":6,"type":"Term","front":"Plasmodesmata","back":"Cytoplasmic channels between plant cells."},{"id":"l6-t-tight-junction","lecture":6,"type":"Term","front":"Tight junction","back":"Watertight seal between animal cells (skin, bladder)."},{"id":"l6-t-desmosome","lecture":6,"type":"Term","front":"Desmosome","back":"Spot-weld junction in tissues that stretch (heart, skin, muscle)."},{"id":"l6-t-gap-junction","lecture":6,"type":"Term","front":"Gap junction","back":"Animal communication channel; lets cardiac muscle contract together."},{"id":"l6-t-centriole","lecture":6,"type":"Term","front":"Centriole","back":"Animal microtubule structure used in cell division."},{"id":"l6-c-light-vs-electron-microscope","lecture":6,"type":"Compare","front":"Light vs electron microscope","back":"Portable 40–1000× vs higher-resolution research instrument."},{"id":"l6-c-prokaryote-vs-eukaryote","lecture":6,"type":"Compare","front":"Prokaryote vs eukaryote","back":"No nucleus/organelles vs nucleus + organelles."},{"id":"l6-c-plant-vs-animal-cell","lecture":6,"type":"Compare","front":"Plant vs animal cell","back":"Wall, chloroplasts, big vacuole vs lysosomes, centrioles, ECM."},{"id":"l6-c-rough-er-vs-smooth-er","lecture":6,"type":"Compare","front":"Rough ER vs smooth ER","back":"Ribosomes/proteins vs lipids/detox/Ca2+."},{"id":"l6-c-microfilament-vs-microtubule","lecture":6,"type":"Compare","front":"Microfilament vs microtubule","back":"Thinnest movement fibers vs widest hollow tubes."},{"id":"l6-c-plasmodesmata-vs-gap-junction","lecture":6,"type":"Compare","front":"Plasmodesmata vs gap junction","back":"Plant channels vs animal channels."},{"id":"l6-c-tight-junction-vs-desmosome","lecture":6,"type":"Compare","front":"Tight junction vs desmosome","back":"Waterproof seal vs stretchy spot-weld."}];
    const KEY = "biol1414-drill-v1";

    let progress = load();
    let lecture = "all", kind = "all";
    let queue=[], index=0, guess="", revealed=false, verdict=null;

    function load(){ try { return JSON.parse(localStorage.getItem(KEY))||{known:[],needsWork:[]}; } catch { return {known:[],needsWork:[]}; } }
    function save(){ localStorage.setItem(KEY, JSON.stringify(progress)); }
    function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
    function tokenize(t){ return t.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w)); }
    function gradeGuess(g, ans){
      const trimmed=g.trim(); if(!trimmed) return null;
      const G=tokenize(trimmed), A=tokenize(ans);
      if(!G.length) return ans.toLowerCase().includes(trimmed.toLowerCase());
      const aset=new Set(A);
      const coverage=G.filter(w=>aset.has(w)).length/Math.max(G.length,1);
      const reverse=A.filter(w=>G.includes(w)).length/Math.max(A.length,1);
      if(ans.toLowerCase().includes(trimmed.toLowerCase()) && trimmed.length>=4) return true;
      return coverage>=0.45 || reverse>=0.35;
    }
    function esc(s){ return String(s).replace(/[&<>"']/g, c => '&#'+c.charCodeAt(0)+';'); }
    function pool(){
      const known=new Set(progress.known);
      return CARDS.filter(c=>{
        if(lecture!=="all" && c.lecture!==lecture) return false;
        if(kind!=="all" && c.type!==kind) return false;
        if(known.has(c.id)) return false;
        return true;
      });
    }
    function rebuildQueue(){
      queue=shuffle(pool().map(c=>c.id)); index=0; guess=""; revealed=false; verdict=null;
    }
    rebuildQueue();

    function current(){ return CARDS.find(c=>c.id===queue[index]); }

    function render(){
      wireNav();
      const p=pool();
      const knownIn = CARDS.filter(c=> (lecture==="all"||c.lecture===lecture) && (kind==="all"||c.type===kind) && progress.known.includes(c.id)).length;
      const needIn = CARDS.filter(c=> (lecture==="all"||c.lecture===lecture) && (kind==="all"||c.type===kind) && progress.needsWork.includes(c.id)).length;
      document.getElementById("stats").innerHTML =
        `<span class="stat">In deck ${p.length}</span><span class="stat">Known ${knownIn}</span><span class="stat">Needs work ${needIn}</span>`;
      const lec=document.getElementById("lec");
      lec.innerHTML="";
      [["all","All"],["2","2 Method"],["3","3 Life"],["4","4 Chemistry"],["5","5 Molecules"],["6","6 Cells"]].forEach(([id,lab])=>{
        const b=document.createElement("button"); b.className="chip"+(String(lecture)===id?" on":""); b.textContent=lab;
        b.onclick=()=>{ lecture=id==="all"?"all":Number(id); rebuildQueue(); render(); };
        lec.appendChild(b);
      });
      const kd=document.getElementById("kind");
      kd.innerHTML="";
      [["all","All types"],["Term","Terms"],["Compare","Compare"]].forEach(([id,lab])=>{
        const b=document.createElement("button"); b.className="chip"+(kind===id?" on":""); b.textContent=lab;
        b.onclick=()=>{ kind=id; rebuildQueue(); render(); };
        kd.appendChild(b);
      });

      const stage=document.getElementById("stage");
      const q=current();
      if(!q){
        stage.innerHTML=`<p>No cards left in this filter. Reset Known to bring tagged cards back.</p>
          <div class="row" style="margin-top:1rem"><button class="btn sec" id="reset">Reset known</button></div>`;
        const r=document.getElementById("reset"); if(r) r.onclick=()=>{ progress.known=[]; save(); rebuildQueue(); render(); };
        return;
      }
      let body = `<div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem">
        <span class="stat">Lecture ${q.lecture} · ${q.type}</span>
        <span class="stat">${index+1} / ${queue.length}</span>
      </div>
      <h2 style="font-family:var(--font-display);font-weight:500;font-size:1.6rem;margin:0">${esc(q.front)}</h2>
      <label style="display:block;margin-top:1.1rem"><span style="display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:.4rem">Your answer</span>
        <textarea id="guess" ${revealed?"disabled":""}>${esc(guess)}</textarea></label>`;
      if(!revealed){
        body += `<div class="row" style="margin-top:1.1rem"><button class="btn" id="reveal">Reveal</button><button class="btn sec" id="shuf">Shuffle remaining</button></div>`;
      } else {
        const ok = verdict===true;
        body += `<div class="verdict ${ok?"ok":"bad"}" style="margin-top:1.1rem"><strong>${ok?"Correct": (verdict===false?"Incorrect":"No guess")}</strong>
          <p>${esc(q.back)}</p></div>
          <div class="row" style="margin-top:1rem">
            <button class="btn" id="next">Next</button>
            <button class="btn ok" id="known">Known</button>
            <button class="btn bad" id="need">Needs work</button>
          </div>`;
      }
      stage.innerHTML=body;
      const g=document.getElementById("guess"); if(g) g.oninput=e=>{ guess=e.target.value; };
      const rev=document.getElementById("reveal");
      if(rev) rev.onclick=()=>{ if(g) guess=g.value; revealed=true; verdict=gradeGuess(guess, q.back); render(); };
      const sh=document.getElementById("shuf");
      if(sh) sh.onclick=()=>{ rebuildQueue(); render(); };
      const nx=document.getElementById("next");
      if(nx) nx.onclick=()=>{
        guess=""; revealed=false; verdict=null;
        if(index+1<queue.length) index++; else rebuildQueue();
        render();
      };
      const kn=document.getElementById("known");
      if(kn) kn.onclick=()=>{
        progress.known=progress.known.filter(id=>id!==q.id);
        progress.needsWork=progress.needsWork.filter(id=>id!==q.id);
        progress.known.push(q.id); save();
        queue=queue.filter(id=>id!==q.id && !progress.known.includes(id));
        index=0; guess=""; revealed=false; verdict=null; render();
      };
      const nd=document.getElementById("need");
      if(nd) nd.onclick=()=>{
        progress.known=progress.known.filter(id=>id!==q.id);
        progress.needsWork=progress.needsWork.filter(id=>id!==q.id);
        progress.needsWork.push(q.id); save();
        render();
      };
    }
    wireNav();
    render();
  </script>
</body>
</html>
